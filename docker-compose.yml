version: '3.8'

services:
  # 1. FastAPI LangGraph Engine
  api:
    build:
      context: ./humantext-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/humantext
      - OLLAMA_HOST=http://host.docker.internal:11434 # Point to host's Ollama instance
    depends_on:
      db:
        condition: service_healthy
    networks:
      - humantext_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2. Next.js Frontend UI
  web:
    build:
      context: ./humantext-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - humantext_net

  # 3. PostgreSQL Database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=humantext
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - humantext_net

  # 4. Redis Cache for Job Queues and Rate Limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - humantext_net

networks:
  humantext_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
